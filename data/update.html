<!DOCTYPE HTML><html><head>
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="index.css" />
  </head>
  <body>
  <h1> Settings </h1>
  <h3>
Interval between readings (between 2 min and 120 min) 
  <form action="/get">
  <label for="interval0"> Current Value is %interval0_html% (Standard = 10 min):</label>
  <input type="number" id="interval0" name="interval0" min="2" max="120">
  <input type="submit" value="Submit">
  </form><br>
  <p>
  <form action="/get"> 
    Title: <input type="text" name="title">
    <input type="submit" value="Submit">
  </form><br>
  
  <p>  
  <form action="/get">
    <button name="calibrate0" type="submit">Calibrate the pH probe</button>
</form>

  <p>  
  <form action="/get">
    <button name="takenewreading0" type="submit">Take a reading and add to dataset </button>
</form>

  <p>  
  <form action="/get">
    <button name="takeph0" type="submit">Take a reading and do not add to dataset</button>
</form>

<p>  
  <form action="/get">
    <button name="restart" type="submit">Restart the device</button>
</form>

<p>
  <form action="/get">
    <button name="reset" type="submit">Reset the data and restart</button>
</form>


<br>
  <div class="navbar"><a href="/"> Home </a></div>


</h3></body>

</html>
